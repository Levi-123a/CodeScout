<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巡码</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark">巡</span><span>巡码</span></a>
    <div class="nav-label">项目 <span id="project-count">0</span></div>
    <nav id="project-list" aria-label="项目列表"></nav>
    <button id="add-project" class="sidebar-add">＋ 接入项目</button>
    <div class="sidebar-bottom"><button id="open-model" class="text-button">模型设置</button></div>
  </aside>
  <main>
    <header><h1>项目</h1><button id="top-add" class="primary">＋ 接入项目</button></header>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div id="model-banner" class="banner" hidden><strong>尚未配置模型</strong><button id="banner-model" class="secondary">配置模型</button></div>
    <section id="empty" class="empty-state"><p>尚未接入项目</p><button id="empty-add" class="primary">选择项目文件夹</button></section>
    <section id="project-view" hidden>
      <div class="project-title"><div class="project-identity"><div class="title-line"><h2 id="project-name"></h2><span id="project-status" class="badge"></span></div><details id="project-path-detail" class="path-detail"><summary>文件夹路径</summary><p id="project-path" class="path"></p></details></div><div class="actions"><button id="edit-project" class="secondary">项目设置</button><button id="pause-project" class="secondary">暂停监控</button><button id="retry-project" class="secondary">重新检查</button><button id="remove-project" class="icon-button" aria-label="移除项目监控">移除</button></div></div>
      <div class="stats"><article><span>待处理问题</span><strong id="open-count">0</strong></article><article><span>最近检查范围</span><strong id="coverage-count" class="time-value">—</strong><small id="coverage-caption">尚无覆盖记录</small></article><article><span>最近检查</span><strong id="checked-time" class="time-value">—</strong></article></div>
      <div id="check-progress" class="check-progress" role="status" hidden><span id="check-progress-text"></span><progress id="check-progress-bar" max="1" value="0" aria-label="检查批次进度"></progress></div>
      <div id="project-error" class="error-box" hidden></div>
      <div class="scope-note"><span id="git-caption"></span></div>
      <div class="tabs"><button id="findings-tab" class="tab active">问题</button><button id="runs-tab" class="tab">检查记录</button><button id="repairs-tab" class="tab">修复记录</button><label class="filter">状态 <select id="finding-filter"><option value="open">待处理</option><option value="all">全部</option><option value="ignored">已忽略</option><option value="resolved">已解决</option></select></label></div>
      <div id="findings-list"></div><div id="runs-list" hidden></div><div id="repairs-list" hidden></div>
    </section>
  </main>
  <dialog id="project-dialog"><form id="project-form"><div class="dialog-heading"><h2>项目设置</h2><button type="button" data-close="project-dialog" class="icon-button" aria-label="关闭">✕</button></div><label>项目文件夹<input name="path" required readonly autocomplete="off"></label><label>约定文件<input name="rules_file" value="CODESCOUT_RULES.md" readonly></label><label>约定内容 <span>保存到项目根目录的约定文件</span><textarea name="custom_rules" rows="5" placeholder="填写本项目的检查约定" maxlength="20000"></textarea></label><label>排除路径 <span>每行一个，支持通配符</span><textarea name="excludes" rows="2" placeholder="generated/**&#10;fixtures/**"></textarea></label><label>验证命令 <span>可选，在项目目录执行</span><input name="validation_command" placeholder="例如：python -m unittest discover" autocomplete="off"></label><p class="form-note">未配置验证命令时，修复仅执行支持的语法检查。</p><label class="checkbox-label"><input name="allow_send" type="checkbox" required><span>允许把检查与修复所需的代码、注释、文档和约定发送到已配置的外部模型。</span></label><button type="submit" class="primary full">接入</button></form></dialog>
  <dialog id="model-dialog"><form id="model-form"><div class="dialog-heading"><h2>模型设置</h2><button type="button" data-close="model-dialog" class="icon-button" aria-label="关闭">✕</button></div><p class="form-note">使用兼容 Chat Completions 的接口，所有项目共享此配置。</p><label>API 基础地址<input name="base_url" type="url" required placeholder="https://your-provider.example/v1" autocomplete="off"></label><label>模型名称<input name="model" required maxlength="200" autocomplete="off"></label><label>API 密钥 <span id="key-hint">仅保存在本机</span><input name="api_key" type="password" autocomplete="new-password"></label><div class="form-grid"><label>请求超时（秒）<input name="timeout" type="number" min="1" max="300" value="60" required></label><label>单次输入预算（字符）<input name="context_chars" type="number" min="2000" max="200000" value="12000" required></label></div><p class="form-note">请求分批执行，单次最多 12,000 字符。</p><button type="submit" class="primary full">保存</button></form></dialog>
  <dialog id="repair-dialog" class="repair-dialog"><form id="repair-form"><div class="dialog-heading"><h2 id="repair-title">修复预览</h2><button type="button" data-close="repair-dialog" class="icon-button" aria-label="关闭">✕</button></div><p id="repair-stage" class="repair-stage" role="status" aria-live="polite"></p><p id="repair-files" class="location"></p><div id="repair-error" class="error-box" role="alert" hidden></div><pre id="repair-diff" class="diff"></pre><details id="repair-events-detail"><summary>读取与定位记录</summary><pre id="repair-events"></pre></details><p id="repair-verification" class="form-note"></p><pre id="repair-output" class="verification-output" hidden></pre><p id="repair-apply-note" class="form-note"></p><button id="apply-repair" type="button" class="primary full" disabled>应用修改</button></form></dialog>
</body>
</html>
